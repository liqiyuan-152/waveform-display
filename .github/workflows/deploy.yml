name: Test and deploy to Dokploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: waveform-display-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:demo
        env:
          DEMO_BASE_PATH: /waveform-display/
      - name: Notify Dokploy
        env:
          DOKPLOY_DEPLOY_URL: ${{ secrets.DOKPLOY_DEPLOY_URL }}
        shell: bash
        run: |
          test -n "$DOKPLOY_DEPLOY_URL"
          jq -n --arg sha "$GITHUB_SHA" '{ref:"refs/heads/main",after:$sha,head_commit:{id:$sha,message:"GitHub Actions: tested main deployment"},commits:[{modified:["Dockerfile"]}]}' > /tmp/deploy-payload.json
          curl --fail --silent --show-error --connect-timeout 15 --max-time 60 \
            -H 'Content-Type: application/json' -H 'X-GitHub-Event: push' \
            --data-binary @/tmp/deploy-payload.json "$DOKPLOY_DEPLOY_URL"
      - name: Verify published commit
        shell: bash
        run: |
          for attempt in $(seq 1 90); do
            published=$(curl --silent --fail --connect-timeout 5 --max-time 10 "https://lqycustomsite.online/waveform-display/version.txt?run=$GITHUB_RUN_ID" || true)
            if [ "$published" = "$GITHUB_SHA" ]; then
              echo "Verified published commit $GITHUB_SHA"
              exit 0
            fi
            sleep 10
          done
          echo 'Deployment did not publish the expected commit; inspect Dokploy deployment logs.' >&2
          exit 1
